# Steward S3C Shadow Fixture — Dagu workflow (DR-005)
#
# MANUAL ONLY. This workflow is NEVER scheduled and NEVER auto-triggered.
# It runs the fixture-only S3C shadow pipeline against an ephemeral
# (memory) backend and asserts the shadow-only safety classification.
#
# It must NOT be installed on the VPS. It is a local qualification artifact.
#
# Safe by construction:
#   - no schedule / no trigger  (manual execution only)
#   - fixture-only               (run-fixture path, no live apply exists)
#   - ephemeral backend          (--backend memory, nothing written to disk)
#   - no credentials             (no env secrets, no SSH, no registry login)
#   - cleanup                    (temp dirs removed; nothing persisted)
#   - expected result:          READY_FOR_SHADOW_ONLY

name: steward-s3c-shadow-fixture
type: graph
# Intentionally absent: schedule, scheduler, timezone, retry policy, mailOn.
# Dagu treats a workflow with no schedule as manual-only.

env:
  - STEWARD_HOME: /opt/steward
  - PYTHONPATH: /opt/steward
  - DAGU_HOME: /var/lib/dagu

steps:
  - id: assert_python_runtime
    run: python3 --version

  - id: run_s3c_fixture_shadow
    run: >-
      python3 -m steward.s3ccli run-fixture
      --backend memory
      --namespace steward:shadow:gastown
      --findings find_1
    output: FIXTURE_OUTPUT
    depends: [assert_python_runtime]

  - id: assert_shadow_only_classification
    run: >-
      python3 -c "import os,sys;
      out=os.environ.get('FIXTURE_OUTPUT','');
      ok=('shadow' in out.lower()) or ('READY_FOR_SHADOW_ONLY' in out);
      print('SHADOW_ONLY_OK' if ok else 'NOT_SHADOW_ONLY');
      sys.exit(0 if ok else 1)"
    depends: [run_s3c_fixture_shadow]

  - id: readiness_check
    run: python3 -m steward.s3ccli readiness
    output: READINESS_OUTPUT
    depends: [assert_shadow_only_classification]

  - id: assert_readiness_shadow_only
    run: >-
      python3 -c "import os,sys;
      out=os.environ.get('READINESS_OUTPUT','');
      ok='READY_FOR_SHADOW_ONLY' in out;
      print('READINESS_SHADOW_ONLY' if ok else 'READINESS_NOT_SHADOW');
      sys.exit(0 if ok else 1)"
    depends: [readiness_check]

  - id: cleanup_temp_artifacts
    run: sh -c "rm -f /tmp/steward_fixture_* 2>/dev/null; echo cleanup-done"
    depends: [assert_readiness_shadow_only]

# Dagu-level guardrail (best-effort; not a substitute for the interlock).
timeout_sec: 300
