version: "3.8"

x-common-env: &common-env
  TRAEFIK_HOST: srv1345984.hstgr.cloud

services:
  # ========================
  # LOKI — Log aggregation
  # ========================
  loki:
    image: grafana/loki:2.9.10
    restart: unless-stopped
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./loki/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - fed-net
    labels:
      - traefik.enable=true
      - "traefik.http.routers.loki.rule=Host(`loki.${TRAEFIK_HOST}`)"
      - traefik.http.routers.loki.entrypoints=websecure
      - traefik.http.routers.loki.tls.certresolver=letsencrypt
      - traefik.http.services.loki.loadbalancer.server.port=3100
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M

  # ========================
  # PROMTAIL — Log shipper
  # ========================
  promtail:
    image: grafana/promtail:2.9.10
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - fed-net
    depends_on:
      loki:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 64M

  # ========================
  # BACKUP — Daily pg_dump + volume tar
  # ========================
  backup:
    image: postgres:15-alpine
    restart: "no"
    volumes:
      - ./backup/backup.sh:/usr/local/bin/backup.sh:ro
      - /docker/federation-game/backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    networks:
      - fed-net
    environment:
      - PGHOST=postgres
      - PGUSER=federation
      - PGPASSWORD=federation_pwd
      - PGDATABASE=federation_game
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - BACKUP_DIR=/backups
      - RETENTION_DAYS=7
    labels:
    # Cronicle can trigger this, or use docker compose run
      - "infra.role=backup"

  # ========================
  # WEBHOOK DEPLOY — GitHub push listener
  # ========================
  webhook-deploy:
    image: almir/webhook:2.8.1
    restart: unless-stopped
    command: -hooks /etc/webhook/hooks.json -port 9101 -verbose
    volumes:
      - ./webhook/hooks.json:/etc/webhook/hooks.json:ro
      - ./webhook/deploy.sh:/usr/local/bin/deploy.sh:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /docker/federation-game:/docker/federation-game
      - /tmp:/tmp
    networks:
      - fed-net
    labels:
      - traefik.enable=true
      - "traefik.http.routers.webhook.rule=Host(`webhook.${TRAEFIK_HOST}`)"
      - traefik.http.routers.webhook.entrypoints=websecure
      - traefik.http.routers.webhook.tls.certresolver=letsencrypt
      - traefik.http.services.webhook.loadbalancer.server.port=9101
    environment:
      - GITHUB_SECRET=${GITHUB_WEBHOOK_SECRET:-changeme}
    deploy:
      resources:
        limits:
          memory: 32M

volumes:
  loki-data:

networks:
  fed-net:
    external: true
    name: fed-net
