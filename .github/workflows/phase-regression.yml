# Phase Regression
#
# Runs the per-phase Node smoke tests (test-phase-*.js) for the federation
# simulation. These test files are committed only on the PR branches that
# introduce them, so they do not exist on `main`/`master`.
#
# Trigger scope (intentional):
#   - pull_request:        validate every PR that adds/modifies phase tests
#   - push to feature/**:   validate feature branches on push
#   - workflow_dispatch:   manual re-run
# The previous `schedule` (nightly) and `push: [main, master]` triggers were
# removed because running against `main` always skipped every phase test (they
# are absent there) — a machine that screamed into the void nightly. Keeping the
# trigger scoped to branches that actually carry the tests keeps CI honest.
#
# NOTE: External check statuses (Kilo Code Review, Continuous AI agents from
# continue.dev) are not controlled by this workflow. If they fail with service-
# side errors, a repo admin must retry them from the respective dashboards or
# remove them from branch protection.

name: Phase Regression

on:
  push:
    branches:
      - feature/**
  pull_request:
  workflow_dispatch:

# Least-privilege token: this workflow only checks out and runs Node smoke
# tests, so it needs read access to repo contents and nothing else.
permissions:
  contents: read

concurrency:
  group: phase-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-phase-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Phase 6 Baseline
        run: |
          for f in test-phase-6-1-knowledge.js test-phase-6-2-resilience.js test-phase-6-3-learning.js test-phase-6-4-orchestration.js; do
            if [ -f "$f" ]; then
              node "$f"
            else
              echo "Skipping $f (not found)"
            fi
          done

      - name: Phase 7 Aggregate
        run: |
          if [ -f test-phase-7-all.js ]; then
            node test-phase-7-all.js
          else
            echo "Skipping test-phase-7-all.js (not found)"
          fi

      - name: Phase 8 Aggregate
        run: |
          if [ -f test-phase-8-all.js ]; then
            node test-phase-8-all.js
          else
            echo "Skipping test-phase-8-all.js (not found)"
          fi

      - name: Phase 8 Deterministic Loop
        run: |
          if [ -f test-phase-8-completion.js ]; then
            for i in $(seq 1 10); do
              echo "Run $i"
              node test-phase-8-completion.js
            done
          else
            echo "Skipping test-phase-8-completion.js (not found)"
          fi

      - name: Regression Summary
        run: |
          {
            echo "## Phase Regression Summary"
            echo ""
            echo "Phase test files are expected only on PR branches that add them;"
            echo "on branches without them the relevant steps skip (not fail)."
            echo ""
            for f in test-phase-6-1-knowledge.js test-phase-6-2-resilience.js test-phase-6-3-learning.js test-phase-6-4-orchestration.js test-phase-7-all.js test-phase-8-all.js test-phase-8-completion.js; do
              if [ -f "$f" ]; then
                echo "- ran: $f"
              else
                echo "- skipped (not found): $f"
              fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
