name: Deploy to VPS

on:
  workflow_dispatch:
    inputs:
      target:
        description: "What to deploy"
        required: true
        default: "backend"
        type: choice
        options:
          - backend
          - worker
          - frontend
          - html-only
          - all
      html_file:
        description: "Specific HTML file (for html-only target)"
        required: false
        type: string
      skip_validate:
        description: "Skip Python validation (dangerous)"
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    runs-on: [self-hosted, vps]
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy Backend
        if: inputs.target == 'backend' || inputs.target == 'all'
        run: |
          echo "Deploying backend Python files..."
          install -g docker -m 664 federation-game/backend/*.py /docker/federation-game/backend/
          install -g docker -m 664 federation-game/docker-compose-vps.yml /docker/federation-game/docker-compose.yml
          if [ "${{ inputs.skip_validate }}" != "true" ]; then
            echo "Validating Python files..."
            python3 -c "import py_compile; import glob; files=glob.glob('/docker/federation-game/backend/*.py'); [py_compile.compile(f, doraise=True) for f in files]; print(f'All {len(files)} files valid')"
          fi
          echo "Recreating backend with refreshed compose labels..."
          cd /docker/federation-game && docker compose up -d backend
          echo "Backend deployed"

      - name: Deploy Worker
        if: inputs.target == 'worker' || inputs.target == 'all'
        run: |
          echo "Deploying worker Python files..."
          install -g docker -m 664 federation-game/backend/*.py /docker/federation-game/backend/
          if [ "${{ inputs.skip_validate }}" != "true" ]; then
            echo "Validating Python files..."
            python3 -c "import py_compile; import glob; files=glob.glob('/docker/federation-game/backend/*.py'); [py_compile.compile(f, doraise=True) for f in files]; print(f'All {len(files)} files valid')"
          fi
          echo "Building and restarting worker..."
          cd /docker/federation-game && docker compose build worker && docker compose up -d worker
          echo "Worker deployed"

      - name: Deploy Frontend (static assets)
        if: inputs.target == 'frontend' || inputs.target == 'all'
        run: |
          echo "Deploying frontend HTML/CSS/JS assets..."
          mapfile -t ASSETS < <(find federation-game/frontend -maxdepth 1 -type f \( -name '*.html' -o -name '*.css' -o -name '*.js' \) | sort)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "No frontend assets found"
            exit 1
          fi
          install -g docker -m 664 "${ASSETS[@]}" /docker/federation-game/public_html/
          install -g docker -m 664 "${ASSETS[@]}" /docker/federation-game/frontend/
          echo "Recreating frontend..."
          cd /docker/federation-game && docker compose up -d frontend
          echo "Frontend deployed"

      - name: Deploy Single Frontend Entry
        if: inputs.target == 'html-only' && inputs.html_file != ''
        run: |
          FILE="${{ inputs.html_file }}"
          if [ ! -f "federation-game/frontend/${FILE}" ]; then
            echo "Missing frontend file: ${FILE}"
            exit 1
          fi
          ASSETS=("federation-game/frontend/${FILE}")
          case "$FILE" in
            *.html)
              BASE="${FILE%.html}"
              for EXT in css js; do
                CANDIDATE="federation-game/frontend/${BASE}.${EXT}"
                if [ -f "$CANDIDATE" ]; then
                  ASSETS+=("$CANDIDATE")
                fi
              done
              ;;
          esac
          echo "Deploying ${FILE} bundle..."
          install -g docker -m 664 "${ASSETS[@]}" /docker/federation-game/public_html/
          install -g docker -m 664 "${ASSETS[@]}" /docker/federation-game/frontend/
          echo "Recreating frontend..."
          cd /docker/federation-game && docker compose up -d frontend
          echo "${FILE} deployed"

      - name: Verify Deployment
        if: always()
        run: |
          check_json() {
            local url="$1"
            echo "Checking JSON route: ${url}"
            curl -fsS "${url}" | python3 -c 'import json, sys; json.load(sys.stdin)' >/dev/null
          }

          echo "Container status:"
          cd /docker/federation-game && docker compose ps --format "table {{.Name}}\t{{.Status}}" || true
          echo ""
          ROOT_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://federation-game.deliberatefederation.cloud/ || echo 000)
          WORLDGUIDE_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://federation-game.deliberatefederation.cloud/worldguide.html || echo 000)
          WORLDGUIDE_CSS_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://federation-game.deliberatefederation.cloud/worldguide.css || echo 000)
          echo "Root route: HTTP ${ROOT_CODE}"
          echo "World Guide route: HTTP ${WORLDGUIDE_CODE}"
          echo "World Guide CSS route: HTTP ${WORLDGUIDE_CSS_CODE}"
          [ "${ROOT_CODE}" = "200" ]
          [ "${WORLDGUIDE_CODE}" = "200" ]
          [ "${WORLDGUIDE_CSS_CODE}" = "200" ]
          check_json https://federation-game.deliberatefederation.cloud/event
          check_json https://federation-game.deliberatefederation.cloud/simulation
          check_json https://federation-game.deliberatefederation.cloud/spatial/status
          check_json https://federation-game.deliberatefederation.cloud/sectors
