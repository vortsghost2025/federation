services:
  reverse-proxy:
    image: traefik:latest
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --entrypoints.websecure.address=:443
      - --certificatesresolvers.letsencrypt.acme.email=sean@deliberatefederation.cloud
      - --certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json
      - --certificatesresolvers.letsencrypt.acme.httpChallenge.entrypoint=web
    ports:
      - 80:80
      - 443:443
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./letsencrypt:/letsencrypt
    networks:
      - fed-net
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - "traefik.http.routers.fed-api.rule=Host(`federation-game.deliberatefederation.cloud`) && (PathPrefix(`/npcs`) || PathPrefix(`/world`) || Path(`/simulation`) || PathPrefix(`/simulation/`) || PathPrefix(`/spatial`) || PathPrefix(`/sectors`) || Path(`/event`) || PathPrefix(`/political`) || PathPrefix(`/factions`) || PathPrefix(`/broadcast-events`) || PathPrefix(`/quests`) || PathPrefix(`/technology`) || PathPrefix(`/history-arc`) || PathPrefix(`/atlas`) || PathPrefix(`/consciousness`) || PathPrefix(`/engine-status`) || PathPrefix(`/map/`) || PathPrefix(`/state`) || PathPrefix(`/systems-overview`) || PathPrefix(`/timeline`) || PathPrefix(`/rivals`) || PathPrefix(`/reset`) || PathPrefix(`/log`) || PathPrefix(`/choose`) || PathPrefix(`/ws`) || PathPrefix(`/healthz`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`) || PathPrefix(`/redoc`) || PathPrefix(`/cognition`) || PathPrefix(`/narrator`) || PathPrefix(`/agents`) || Path(`/spectator/summary`) || PathPrefix(`/spectator/`) || PathPrefix(`/universe/`))"
      - traefik.http.routers.fed-api.entrypoints=websecure
      - traefik.http.routers.fed-api.tls.certresolver=letsencrypt
      - "traefik.http.routers.fed-api.priority=300"
      - traefik.http.routers.fed-api.service=fed-api-svc
      - "traefik.http.middlewares.strip-api.stripprefix.prefixes=/api"
      - "traefik.http.routers.fed-api-prefix.rule=Host(`federation-game.deliberatefederation.cloud`) && PathPrefix(`/api/`)"
      - traefik.http.routers.fed-api-prefix.entrypoints=websecure
      - traefik.http.routers.fed-api-prefix.tls.certresolver=letsencrypt
      - "traefik.http.routers.fed-api-prefix.priority=310"
      - traefik.http.routers.fed-api-prefix.middlewares=strip-api
      - traefik.http.routers.fed-api-prefix.service=fed-api-svc
      - "traefik.http.routers.fed-api-prefix-http.rule=Host(`federation-game.deliberatefederation.cloud`) && PathPrefix(`/api/`)"
      - traefik.http.routers.fed-api-prefix-http.entrypoints=web
      - traefik.http.routers.fed-api-prefix-http.priority=310
      - traefik.http.routers.fed-api-prefix-http.middlewares=strip-api
      - traefik.http.routers.fed-api-prefix-http.service=fed-api-http-svc
      - "traefik.http.routers.fed-api-http.rule=Host(`federation-game.deliberatefederation.cloud`) && (PathPrefix(`/npcs`) || PathPrefix(`/world`) || Path(`/simulation`) || PathPrefix(`/simulation/`) || PathPrefix(`/spatial`) || PathPrefix(`/sectors`) || Path(`/event`) || PathPrefix(`/political`) || PathPrefix(`/factions`) || PathPrefix(`/broadcast-events`) || PathPrefix(`/quests`) || PathPrefix(`/technology`) || PathPrefix(`/history-arc`) || PathPrefix(`/atlas`) || PathPrefix(`/consciousness`) || PathPrefix(`/engine-status`) || PathPrefix(`/map/`) || PathPrefix(`/state`) || PathPrefix(`/systems-overview`) || PathPrefix(`/timeline`) || PathPrefix(`/rivals`) || PathPrefix(`/reset`) || PathPrefix(`/log`) || PathPrefix(`/choose`) || PathPrefix(`/ws`) || PathPrefix(`/healthz`) || PathPrefix(`/docs`) || PathPrefix(`/openapi.json`) || PathPrefix(`/redoc`) || PathPrefix(`/cognition`) || PathPrefix(`/narrator`) || PathPrefix(`/agents`) || Path(`/spectator/summary`) || PathPrefix(`/spectator/`) || PathPrefix(`/universe/`))"
      - traefik.http.routers.fed-api-http.entrypoints=web
      - "traefik.http.routers.fed-api-http.priority=300"
      - traefik.http.routers.fed-api-http.service=fed-api-http-svc

  backend:
    build: /docker/federation-game/backend
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - '8000'
      - --proxy-headers
      - --forwarded-allow-ips
      - 172.16.2.7
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - /docker/federation-game/backend:/app:ro
      - /docker/federation-game/universe:/docker/federation-game/universe
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"
      interval: 60s
      timeout: 30s
      retries: 3
      start_period: 10s
    depends_on:
      - postgres
      - redis
    networks:
      - fed-net
    labels:
      - traefik.enable=true
      - traefik.http.services.fed-api-svc.loadbalancer.server.port=8000
      - traefik.http.services.fed-api-http-svc.loadbalancer.server.port=8000
      # Operator-only route: restricted to Tailscale + internal Docker networks.
      - "traefik.http.middlewares.fed-operator-allowlist.ipallowlist.sourcerange=100.64.0.0/10, 127.0.0.0/8"
      - "traefik.http.routers.fed-operator.rule=Host(`federation-game.deliberatefederation.cloud`) && Path(`/simulation/operator/councilor-exchange`)"
      - traefik.http.routers.fed-operator.entrypoints=websecure
      - traefik.http.routers.fed-operator.tls.certresolver=letsencrypt
      - traefik.http.routers.fed-operator.service=fed-api-svc
      - "traefik.http.routers.fed-operator.priority=400"
      - traefik.http.routers.fed-operator.middlewares=fed-operator-allowlist
      - "traefik.http.routers.fed-operator-http.rule=Host(`federation-game.deliberatefederation.cloud`) && Path(`/simulation/operator/councilor-exchange`)"
      - traefik.http.routers.fed-operator-http.entrypoints=web
      - traefik.http.routers.fed-operator-http.service=fed-api-http-svc
      - "traefik.http.routers.fed-operator-http.priority=400"
      - traefik.http.routers.fed-operator-http.middlewares=fed-operator-allowlist
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M

  frontend:
    build: /docker/federation-game/frontend
    restart: unless-stopped
    volumes:
      - /docker/federation-game/public_html:/usr/share/nginx/html:ro
      - /docker/federation-game/frontend/nginx-default.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - traefik.enable=true
      - "traefik.http.routers.federation-game.rule=Host(`federation-game.deliberatefederation.cloud`)"
      - traefik.http.routers.federation-game.entrypoints=websecure
      - traefik.http.routers.federation-game.tls.certresolver=letsencrypt
      - traefik.http.routers.federation-game.service=federation-game-svc
      - traefik.http.routers.federation-game.priority=100
      - traefik.http.services.federation-game-svc.loadbalancer.server.port=80
      - "traefik.http.routers.federation-game-http.rule=Host(`federation-game.deliberatefederation.cloud`)"
      - traefik.http.routers.federation-game-http.entrypoints=web
      - traefik.http.routers.federation-game-http.service=federation-game-http-svc
      - traefik.http.services.federation-game-http-svc.loadbalancer.server.port=80
      - "traefik.http.routers.fed-sim-html.rule=Host(`federation-game.deliberatefederation.cloud`) && (Path(`/simulation.html`) || Path(`/bridge.html`) || Path(`/starmap.html`) || Path(`/starmap3d.html`) || Path(`/earth.html`) || Path(`/constellation.html`) || PathPrefix(`/worldguide`) || Path(`/adult.html`) || Path(`/spectator.html`) || Path(`/council-chat.html`) || Path(`/index.html`) || Path(`/spectator.css`) || Path(`/spectator.js`))"
      - traefik.http.routers.fed-sim-html.entrypoints=websecure
      - traefik.http.routers.fed-sim-html.tls.certresolver=letsencrypt
      - "traefik.http.routers.fed-sim-html.priority=400"
      - traefik.http.routers.fed-sim-html.service=fed-sim-html-svc
      - traefik.http.services.fed-sim-html-svc.loadbalancer.server.port=80
      - "traefik.http.routers.fed-sim-html-http.rule=Host(`federation-game.deliberatefederation.cloud`) && (Path(`/simulation.html`) || Path(`/bridge.html`) || Path(`/starmap.html`) || Path(`/starmap3d.html`) || Path(`/earth.html`) || Path(`/constellation.html`) || PathPrefix(`/worldguide`) || Path(`/adult.html`) || Path(`/spectator.html`) || Path(`/council-chat.html`) || Path(`/index.html`) || Path(`/spectator.css`) || Path(`/spectator.js`))"
      - traefik.http.routers.fed-sim-html-http.entrypoints=web
      - traefik.http.routers.fed-sim-html-http.service=fed-sim-html-http-svc
      - traefik.http.services.fed-sim-html-http-svc.loadbalancer.server.port=80
    depends_on:
      - backend
    networks:
      - fed-net

  worker:
    build: /docker/federation-game/backend
    command: python -u worker.py
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TICK_INTERVAL=600
    depends_on:
      - redis
      - postgres
    networks:
      - fed-net
    volumes:
      - /docker/federation-game/backend:/app:ro

  postgres:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=federation
      - POSTGRES_PASSWORD=federation_pwd
      - POSTGRES_DB=federation_game
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U federation -d federation_game
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fed-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    volumes:
      - redis_data:/data
    networks:
      - fed-net

  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      - postgres
    networks:
      - fed-net
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.adminer-allowlist.ipallowlist.sourcerange=100.64.0.0/10,127.0.0.0/8
      - "traefik.http.routers.adminer.rule=Host(`adminer.federation-game.deliberatefederation.cloud`)"
      - traefik.http.routers.adminer.entrypoints=websecure
      - traefik.http.routers.adminer.tls.certresolver=letsencrypt
      - traefik.http.services.adminer-svc.loadbalancer.server.port=8080
      - traefik.http.routers.adminer.middlewares=adminer-allowlist

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - /docker/federation-game/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=512MB'
    networks:
      - fed-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    entrypoint: ["/etc/grafana/entrypoint.sh"]
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/federation-overview.json
      - GF_USERS_DEFAULT_THEME=dark
      - GF_SERVER_ROOT_URL=https://federation-game.deliberatefederation.cloud/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
    volumes:
      - /docker/federation-game/monitoring/provisioning:/etc/grafana/provisioning:ro
      - /docker/federation-game/monitoring/provisioning/dashboards:/var/lib/grafana/dashboards:ro
      - /docker/federation-game/monitoring/grafana-config/grafana.ini:/etc/grafana/grafana.ini:ro
      - /docker/federation-game/monitoring/grafana-dashboards-home/custom.css:/etc/grafana/custom.css:ro
      - /docker/federation-game/monitoring/grafana-entrypoint.sh:/etc/grafana/entrypoint.sh:ro
      - grafana_data:/var/lib/grafana
    networks:
      - fed-net
    labels:
      - traefik.enable=true
      - traefik.http.middlewares.grafana-allowlist.ipallowlist.sourcerange=100.95.92.117/32,127.0.0.1/32
      - "traefik.http.routers.grafana.rule=Host(`federation-game.deliberatefederation.cloud`) && PathPrefix(`/grafana`)"
      - traefik.http.routers.grafana.entrypoints=websecure
      - traefik.http.routers.grafana.tls.certresolver=letsencrypt
      - "traefik.http.routers.grafana.priority=200"
      - traefik.http.routers.grafana.service=grafana-svc
      - traefik.http.routers.grafana.middlewares=grafana-allowlist
      - traefik.http.services.grafana-svc.loadbalancer.server.port=3000
      - "traefik.http.routers.grafana-http.rule=Host(`federation-game.deliberatefederation.cloud`) && PathPrefix(`/grafana`)"
      - traefik.http.routers.grafana-http.entrypoints=web
      - traefik.http.routers.grafana-http.priority=200
      - traefik.http.routers.grafana-http.service=grafana-http-svc
      - traefik.http.services.grafana-http-svc.loadbalancer.server.port=3000
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M

  node-exporter:
    image: prom/node-exporter:latest
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|etc|var/(run|lib/docker))$$'
    networks:
      - fed-net
    deploy:
      resources:
        limits:
          memory: 32M

  redis-exporter:
    image: oliver006/redis_exporter:alpine
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis:6379
    networks:
      - fed-net
    deploy:
      resources:
        limits:
          memory: 32M

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://federation:federation_pwd@postgres:5432/federation_game?sslmode=disable
    networks:
      - fed-net
    deploy:
      resources:
        limits:
          memory: 32M

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    restart: unless-stopped
    command:
      - '--docker_only'
      - '--store_container_labels=false'
      - '--housekeeping_interval=30s'
      - '--global_housekeeping_interval=60s'
      - '--enable_metrics=cpu,memory'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker/ro
      - /dev/disk/:/dev/disk:ro
    networks:
      - fed-net
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.50"

  npc-agent-001:
    build: /docker/federation-game/npc-agent
    restart: unless-stopped
    environment:
      - CHAR_ID=char_001
      - NPC_NAME=Archimedes Prime
      - NVIDIA_API_KEY=${NVIDIA_API_KEY_CHAR_001_TEST}
      - REDIS_URL=redis://redis:6379/0
      - PRIMARY_MODEL=nvidia/llama-3.3-nemotron-super-49b-v1
      - DECISION_MODEL=nvidia/nemotron-3-nano-30b-a3b
      - FALLBACK_MODEL_1=nvidia/nemotron-3-nano-30b-a3b
      - FALLBACK_MODEL_2=meta/llama-3.3-70b-instruct
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY_1}
      - REQUEST_TIMEOUT=20
      - MAX_OUTPUT_TOKENS=1024
      - MAX_TOTAL_BUDGET_MS=120000
      - TICK_INTERVAL=120
    volumes:
      - /docker/federation-game/npc-agent:/app:ro
    depends_on:
      - redis
    networks:
      - fed-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M

  npc-agent-306:
    build: /docker/federation-game/npc-agent
    restart: unless-stopped
    environment:
      - CHAR_ID=char_306
      - NPC_NAME=The Oracle
      - NVIDIA_API_KEY=${NVIDIA_API_KEY_CHAR_306:-KEY_REDACTED_set_in_env}
      - REDIS_URL=redis://redis:6379/0
      - PRIMARY_MODEL=nvidia/nemotron-3-super-120b-a12b
      - DECISION_MODEL=nvidia/nemotron-3-nano-30b-a3b
      - FALLBACK_MODEL_1=nvidia/nemotron-3-nano-30b-a3b
      - FALLBACK_MODEL_2=meta/llama-3.1-70b-instruct
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY_1}
      - REQUEST_TIMEOUT=20
      - MAX_OUTPUT_TOKENS=1024
      - MAX_TOTAL_BUDGET_MS=120000
      - TICK_INTERVAL=120
      # Operator-only OpenRouter route (OFF by default; see OPERATOR_ROUTE_ENABLED).
      # Enable with ORACLE_OPERATOR_ROUTE_ENABLED=true plus the operator config vars.
      # Reversion: set ORACLE_OPERATOR_ROUTE_ENABLED=false and recreate the container.
      - OPERATOR_ROUTE_ENABLED=${ORACLE_OPERATOR_ROUTE_ENABLED:-false}
      - OPERATOR_LLM_BASE_URL=${ORACLE_OPERATOR_LLM_BASE_URL:-https://openrouter.ai/api/v1}
      - OPERATOR_LLM_API_KEY=${OPENROUTER_API_KEY:-}
      - OPERATOR_DECISION_MODEL=${ORACLE_OPERATOR_DECISION_MODEL:-openrouter/free}
      - OPERATOR_REQUEST_TIMEOUT=${ORACLE_OPERATOR_REQUEST_TIMEOUT:-90}
      - OPERATOR_MAX_OUTPUT_TOKENS=${ORACLE_OPERATOR_MAX_OUTPUT_TOKENS:-4096}
    volumes:
      - /docker/federation-game/npc-agent:/app:ro
    depends_on:
      - redis
    networks:
      - fed-net
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
  # -- NPC SANDBOX -----------------------------------------------------------
  npc-sandbox:
    build: /docker/federation-game/npc-sandbox
    restart: unless-stopped
    volumes:
      - artifacts_data:/artifacts
    networks:
      - fed-net
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 256M
    environment:
      - ARTIFACTS_DIR=/artifacts
      - MAX_EXECUTION_SECONDS=30
      - MAX_MEMORY_MB=256

networks:
  fed-net:
    name: fed-net
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:
  artifacts_data:
  redis_data:
