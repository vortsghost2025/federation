<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FEDERATION EARTH COMMAND</title>
    <style>
        body{margin:0;padding:0;font-family:Arial,Helvetica,sans-serif;background:#222;color:#fff;}
        .top{background:#005f5f;padding:20px;text-align:center;font-size:24px;font-weight:bold;}
        .grid{display:grid;grid-template-columns:1fr 2fr 1fr;gap:10px;padding:10px;height:calc(100vh-80px);}
        .panel{background:#333;padding:10px;border-radius:5px;overflow:auto;}
        .heading{font-size:18px;font-weight:bold;margin-bottom:5px;background:#004040;padding:5px;color:#fff;border-radius:3px;}
        .stat{display:flex;justify-content:space-between;margin:5px 0;color:#bbb;}
        .stat span{color:#fff;}
        .preview{background:#111;padding:10px;border-radius:5px;margin-top:10px;overflow:auto;height:200px;font-family:Monaco,monospace;}
        .btn{padding:8px 12px;background:#005f5f;border:none;border-radius:3px;color:#fff;margin:4px;cursor:pointer;}
        .btn:hover{background:#007f7f;}
        .actions{display:flex;flex-direction:column;align-items:center;gap:6px;}
        .log{background:#111;padding:10px;border-radius:5px;margin-top:10px;overflow:auto;height:120px;font-family:Monaco,monospace;}
        @media(max-width:1200px){.grid{grid-template-columns:1fr;}.panel{height:auto;}}
