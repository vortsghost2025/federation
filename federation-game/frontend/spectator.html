<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Federation — Spectator</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>👁</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #040810;
  --panel: rgba(8,14,24,0.96);
  --border: rgba(0,188,212,0.12);
  --cyan: #00BCD4;
  --cyan-dim: rgba(0,188,212,0.10);
  --amber: #FF9800;
  --amber-dim: rgba(255,152,0,0.10);
  --violet: #9C27B0;
  --violet-dim: rgba(156,39,176,0.10);
  --green: #4CAF50;
  --red: #F44336;
  --red-dim: rgba(244,67,54,0.10);
  --white: #d8dce6;
  --dim: #5a6a7a;
  --bright: #f0f4ff;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--white);font-family:'Share Tech Mono',monospace;font-size:17px}

/* ── STARFIELD ─────────────────────────────────────────────── */
.starfield{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.star{position:absolute;background:#fff;border-radius:50%;animation:twinkle var(--d) ease infinite var(--dl)}
@keyframes twinkle{0%,100%{opacity:.15}50%{opacity:.7}}

/* ── MAIN GRID ─────────────────────────────────────────────── */
#app{
  display:grid;
  grid-template-rows:64px 1fr;
  grid-template-columns:1fr 380px;
  grid-template-areas:
    "top top"
    "main aside";
  height:100vh;gap:1px;
  background:var(--bg);
}

/* ── HEADER ────────────────────────────────────────────────── */
header{grid-area:top;display:flex;align-items:center;gap:0;background:var(--panel);border-bottom:1px solid var(--border);padding:0 16px;z-index:5}
.logo{font-family:'Orbitron',sans-serif;font-weight:900;font-size:22px;letter-spacing:4px;color:var(--cyan);text-shadow:0 0 16px rgba(0,188,212,0.4);white-space:nowrap;margin-right:20px}
.logo-sub{font-size:11px;color:var(--dim);letter-spacing:2px;text-transform:uppercase;font-weight:400;margin-left:8px}
.header-metrics{display:flex;align-items:center;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
.header-metrics::-webkit-scrollbar{display:none}
.hm{display:flex;flex-direction:column;align-items:center;padding:4px 12px;min-width:80px;border-right:1px solid rgba(255,255,255,0.04)}
.hm:last-of-type{border-right:none}
.hm-label{font-size:9px;color:var(--dim);text-transform:uppercase;letter-spacing:1.5px}
.hm-val{font-family:'Orbitron',sans-serif;font-size:18px;font-weight:700}
.hm-bar{width:70px;height:6px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;margin-top:2px}
.hm-fill{height:100%;border-radius:3px;transition:width .8s ease,background .5s ease}
.header-era{margin-left:auto;white-space:nowrap;display:flex;align-items:center;gap:10px}
.era-name{font-family:'Orbitron',sans-serif;font-weight:700;font-size:18px;color:var(--amber);text-shadow:0 0 12px rgba(255,152,0,0.3)}
.era-bar-wrap{display:flex;align-items:center;gap:6px}
.era-bar{width:100px;height:8px;background:rgba(255,255,255,0.05);border-radius:4px;overflow:hidden}
.era-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--cyan),var(--amber));transition:width 1s ease}
.era-pct{font-family:'Orbitron',sans-serif;font-size:14px;color:var(--cyan);min-width:40px}

/* ── MAIN CONTENT ──────────────────────────────────────────── */
main{grid-area:main;display:flex;flex-direction:column;overflow:hidden}

/* Narration hero */
.narration-hero{
  background:linear-gradient(180deg,rgba(0,188,212,0.04) 0%,transparent 100%);
  border-bottom:1px solid var(--border);
  padding:20px 24px 16px;
  min-height:140px;
  position:relative;
}
.narration-badge{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.narration-badge .dot{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:dotPulse 2s ease infinite}
@keyframes dotPulse{0%,100%{opacity:.3}50%{opacity:1}}
.narration-headline{font-family:'Orbitron',sans-serif;font-size:26px;font-weight:700;color:var(--bright);line-height:1.3;margin-bottom:14px;letter-spacing:1px;text-shadow:0 0 20px rgba(0,188,212,0.15)}
.narration-meta{display:flex;gap:16px;font-size:12px;color:var(--dim);align-items:center}
.narration-source{padding:2px 8px;border-radius:3px;font-size:10px;letter-spacing:1px;text-transform:uppercase}
.narration-source.llm{color:var(--cyan);background:var(--cyan-dim)}
.narration-source.fallback{color:var(--amber);background:var(--amber-dim)}
.narration-source.cached{color:var(--dim);background:rgba(255,255,255,0.04)}

/* Developments + Voices row */
.narration-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;padding:0 24px 16px}
.narration-section{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.04);border-radius:8px;padding:14px 16px}
.ns-title{font-family:'Orbitron',sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:8px}
.ns-title.dev{color:var(--amber)}
.ns-title.voice{color:var(--violet)}
.ns-title.fore{color:var(--cyan)}
.ns-item{font-size:14px;line-height:1.5;padding:4px 0;border-bottom:1px solid rgba(255,255,255,0.03);color:var(--white)}
.ns-item:last-child{border-bottom:none}
.ns-item.voice-item{font-style:italic;color:rgba(255,255,255,0.8)}
.ns-item.fore-item{color:var(--cyan);font-style:italic;font-size:15px}

/* ── TAB BAR ──────────────────────────────────────────────── */
.tab-bar{display:flex;gap:0;border-bottom:1px solid var(--border);padding:0 24px;background:var(--panel);flex-shrink:0}
.tab{padding:10px 20px;font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--dim);cursor:pointer;border-bottom:2px solid transparent;transition:all .2s}
.tab:hover{color:var(--white)}
.tab.active{color:var(--cyan);border-bottom-color:var(--cyan);text-shadow:0 0 8px rgba(0,188,212,0.3)}

/* ── TAB CONTENT ───────────────────────────────────────────── */
.tab-content{flex:1;overflow-y:auto;padding:16px 24px;scrollbar-width:thin;scrollbar-color:rgba(0,188,212,0.15) transparent}
.tab-content::-webkit-scrollbar{width:4px}
.tab-content::-webkit-scrollbar-thumb{background:rgba(0,188,212,0.15);border-radius:2px}
.tab-panel{display:none}
.tab-panel.active{display:block}

/* NPC thought cards */
.thought-card{
  background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.05);
  border-left:3px solid var(--dim);
  border-radius:6px;
  padding:12px 14px;
  margin-bottom:8px;
  transition:border-color .3s,background .3s;
}
.thought-card:hover{background:rgba(255,255,255,0.04);border-color:rgba(0,188,212,0.15)}
.thought-header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.thought-name{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:700;letter-spacing:.5px}
.thought-title{font-size:12px;color:var(--dim)}
.thought-faction{font-size:10px;padding:2px 6px;border-radius:3px;letter-spacing:1px;text-transform:uppercase;margin-left:auto}
.thought-body{font-size:15px;line-height:1.6;color:rgba(255,255,255,0.85);font-style:italic;padding-left:12px;border-left:2px solid rgba(255,255,255,0.06)}
.thought-mood{font-size:11px;color:var(--dim);margin-top:6px}
.thought-time{float:right;font-size:10px;color:rgba(255,255,255,0.3)}

/* Quest cards */
.quest-card{
  background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.05);
  border-left:3px solid var(--amber);
  border-radius:6px;
  padding:12px 14px;
  margin-bottom:8px;
}
.quest-header{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.quest-npc{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700}
.quest-name{font-size:14px;color:var(--amber);font-weight:700}
.quest-status{font-size:10px;padding:2px 8px;border-radius:3px;margin-left:auto;letter-spacing:1px;text-transform:uppercase}
.quest-status.active{color:var(--cyan);background:var(--cyan-dim)}
.quest-status.completed{color:var(--green);background:rgba(76,175,80,0.1)}
.quest-status.abandoned{color:var(--red);background:var(--red-dim)}
.quest-progress{height:6px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;margin-top:8px}
.quest-fill{height:100%;border-radius:3px;background:var(--amber);transition:width .6s ease}

/* Tech cards */
.tech-card{
  background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.05);
  border-left:3px solid var(--violet);
  border-radius:6px;
  padding:12px 14px;
  margin-bottom:8px;
}
.tech-header{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.tech-faction{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700}
.tech-name{font-size:14px;color:var(--violet);font-weight:700}
.tech-tier{font-size:10px;color:var(--dim);margin-left:8px}
.tech-progress{height:6px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden;margin-top:8px}
.tech-fill{height:100%;border-radius:3px;background:var(--violet);transition:width .6s ease}
.tech-completed{font-size:11px;color:var(--green);margin-top:6px}

/* Choice cards */
.choice-card{
  background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.05);
  border-left:3px solid var(--cyan);
  border-radius:6px;
  padding:12px 14px;
  margin-bottom:8px;
}
.choice-event{font-size:14px;font-weight:700;color:var(--white);margin-bottom:6px}
.choice-result{font-size:13px;color:var(--cyan);margin-bottom:8px}
.choice-votes{display:flex;flex-wrap:wrap;gap:4px}
.vote-badge{font-size:10px;padding:2px 6px;border-radius:3px;letter-spacing:.5px;background:rgba(255,255,255,0.04)}

/* Event log entries */
.log-entry{
  display:flex;gap:10px;padding:8px 0;border-bottom:1px solid rgba(255,255,255,0.03);
  font-size:14px;line-height:1.5;
  animation:fadeSlide .4s ease;
}
@keyframes fadeSlide{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.log-time{color:var(--dim);font-size:11px;white-space:nowrap;min-width:55px;padding-top:3px}
.log-source{font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:2px 6px;border-radius:3px;white-space:nowrap;align-self:flex-start;min-width:70px;text-align:center}
.log-source.world{color:var(--cyan);background:var(--cyan-dim)}
.log-source.cascade{color:var(--violet);background:var(--violet-dim)}
.log-source.faction{color:var(--amber);background:var(--amber-dim)}
.log-source.quest{color:var(--green);background:rgba(76,175,80,0.1)}
.log-source.tech{color:var(--violet);background:var(--violet-dim)}
.log-source.narration{color:var(--cyan);background:var(--cyan-dim)}
.log-body{flex:1;color:rgba(255,255,255,0.8)}

/* ── ASIDE ─────────────────────────────────────────────────── */
aside{grid-area:aside;border-left:1px solid var(--border);display:flex;flex-direction:column;overflow:hidden;background:var(--panel)}
.aside-title{font-family:'Orbitron',sans-serif;font-weight:700;font-size:13px;letter-spacing:2px;text-transform:uppercase;padding:14px 16px 10px;border-bottom:1px solid var(--border);color:var(--amber);flex-shrink:0}
.faction-list{flex:1;overflow-y:auto;padding:8px;scrollbar-width:thin;scrollbar-color:rgba(255,152,0,0.15) transparent}
.faction-list::-webkit-scrollbar{width:4px}
.faction-list::-webkit-scrollbar-thumb{background:rgba(255,152,0,0.15);border-radius:2px}

.faction-mini{
  background:rgba(255,255,255,0.02);
  border:1px solid rgba(255,255,255,0.04);
  border-radius:6px;
  padding:10px 12px;
  margin-bottom:6px;
  cursor:pointer;
  transition:border-color .3s,background .3s;
}
.faction-mini:hover{background:rgba(255,255,255,0.04);border-color:rgba(255,152,0,0.2)}
.faction-mini.active{border-color:rgba(255,152,0,0.4);box-shadow:0 0 8px rgba(255,152,0,0.1)}
.fm-top{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.fm-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.fm-name{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;flex:1;letter-spacing:.5px}
.fm-power{font-family:'Orbitron',sans-serif;font-size:16px;font-weight:900}
.fm-sub{display:flex;gap:8px;font-size:11px;color:var(--dim)}
.fm-bar{flex:1;height:5px;background:rgba(255,255,255,0.05);border-radius:3px;overflow:hidden}
.fm-fill{height:100%;border-radius:3px;transition:width .6s ease}
.fm-tech{font-size:11px;color:var(--violet);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fm-quest-count{font-size:11px;color:var(--amber);margin-top:2px}
.fm-detail{max-height:0;overflow:hidden;transition:max-height .4s ease,opacity .3s;opacity:0}
.faction-mini.active .fm-detail{max-height:500px;opacity:1;margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.04)}
.fm-stance-row{display:flex;align-items:center;gap:6px;font-size:11px;padding:2px 0}
.fm-stance-name{color:var(--dim);flex:1}
.fm-stance-val{font-weight:700;letter-spacing:.5px}
.fm-action{font-size:11px;color:var(--dim);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Network tab */
.network-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:16px}
.network-node{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-radius:6px;padding:10px 12px;cursor:pointer;transition:border-color .3s,background .3s}
.network-node:hover{background:rgba(255,255,255,0.04);border-color:rgba(0,188,212,0.2)}
.network-node.highlight{border-color:var(--cyan);box-shadow:0 0 8px rgba(0,188,212,0.15)}
.nn-name{font-family:'Orbitron',sans-serif;font-size:13px;font-weight:700;margin-bottom:4px}
.nn-faction{font-size:10px;letter-spacing:1px;text-transform:uppercase;margin-bottom:6px}
.nn-connections{display:flex;flex-wrap:wrap;gap:2px}
.nn-link{font-size:9px;padding:1px 4px;border-radius:2px;margin:1px}
.nn-link.ally{color:#4CAF50;background:rgba(76,175,80,0.1)}
.nn-link.rival{color:#F44336;background:rgba(244,67,54,0.1)}
.nn-link.neutral{color:#78909C;background:rgba(120,144,156,0.1)}

/* Stances matrix */
.stances-matrix{width:100%;border-collapse:separate;border-spacing:3px;margin-top:8px}
.stances-matrix th{font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:1px;text-transform:uppercase;color:var(--dim);padding:6px 4px;text-align:center}
.stances-matrix th.col-header{writing-mode:vertical-lr;text-orientation:mixed;max-width:30px;height:80px}
.stances-matrix td{padding:6px 4px;text-align:center;border-radius:4px;font-size:11px;font-weight:700;transition:background .3s}
.stances-matrix td.self{background:rgba(255,255,255,0.06);color:var(--dim)}
.stances-matrix td.ally{background:rgba(76,175,80,0.15);color:#4CAF50}
.stances-matrix td.cordial{background:rgba(76,175,80,0.08);color:#81C784}
.stances-matrix td.neutral-cell{background:rgba(255,193,7,0.08);color:#FFC107}
.stances-matrix td.tense{background:rgba(255,152,0,0.1);color:#FF9800}
.stances-matrix td.hostile{background:rgba(244,67,54,0.12);color:#F44336}
.stances-cell-val{display:block;font-family:'Orbitron',sans-serif;font-size:12px}
.stances-cell-label{display:block;font-size:9px;letter-spacing:0.5px;text-transform:uppercase;opacity:0.7}

/* Vote detail cards */
.vote-detail-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-left:3px solid var(--cyan);border-radius:6px;padding:12px 14px;margin-bottom:10px}
.vote-event-title{font-size:14px;font-weight:700;color:var(--white);margin-bottom:4px}
.vote-chosen{font-size:13px;color:var(--cyan);margin-bottom:8px}
.vote-faction-row{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:12px}
.vf-name{width:140px;color:var(--dim);font-size:11px;text-transform:uppercase;letter-spacing:0.5px}
.vf-choice{flex:1;color:var(--white);font-size:12px}
.vf-score{font-family:'Orbitron',sans-serif;font-size:11px;min-width:50px;text-align:right}
.vote-consequences{margin-top:8px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.04);font-size:12px;color:var(--dim)}
.vote-consequence-item{padding:2px 0}

/* Brain tab */
.brain-faction-card{background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);border-left:3px solid var(--violet);border-radius:6px;padding:12px 14px;margin-bottom:10px}
.brain-faction-name{font-family:'Orbitron',sans-serif;font-size:14px;font-weight:700;margin-bottom:8px}
.brain-priority{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.bp-label{width:160px;font-size:12px;text-transform:uppercase;letter-spacing:0.5px;color:var(--dim)}
.bp-bar{flex:1;height:8px;background:rgba(255,255,255,0.05);border-radius:4px;overflow:hidden}
.bp-fill{height:100%;border-radius:4px;transition:width .6s ease}
.bp-weight{font-family:'Orbitron',sans-serif;font-size:12px;min-width:30px;text-align:right}

/* ── RESPONSIVE ────────────────────────────────────────────── */
@media(max-width:900px){
  #app{grid-template-columns:1fr;grid-template-areas:"top""main""aside";grid-template-rows:64px 1fr 280px}
  aside{border-left:none;border-top:1px solid var(--border)}
  .narration-row{grid-template-columns:1fr}
}
</style>
</head>
<body>

<div class="starfield" id="starfield"></div>

<div id="app">
  <header>
    <div class="logo">SPECTATOR<span class="logo-sub">observer mode</span></div>
    <div class="header-metrics" id="header-metrics"></div>
    <div class="header-era">
      <span class="era-name" id="era-name">&mdash;</span>
      <div class="era-bar-wrap">
        <div class="era-bar"><div class="era-fill" id="era-fill" style="width:0"></div></div>
        <span class="era-pct" id="era-pct">0%</span>
      </div>
    </div>
  </header>

  <main>
    <!-- Narration Hero -->
    <div class="narration-hero" id="narration-hero">
      <div class="narration-badge"><span class="dot"></span>LATEST INTELLIGENCE</div>
      <div class="narration-headline" id="narration-headline">Awaiting signal from the Federation...</div>
      <div class="narration-meta" id="narration-meta">
        <span class="narration-source cached">initializing</span>
      </div>
    </div>

    <!-- Narration Details Row -->
    <div class="narration-row" id="narration-row">
      <div class="narration-section">
        <div class="ns-title dev">Developments</div>
        <div id="narration-developments"><div class="ns-item" style="color:var(--dim)">Listening...</div></div>
      </div>
      <div class="narration-section">
        <div class="ns-title voice">Voices</div>
        <div id="narration-voices"><div class="ns-item voice-item" style="color:var(--dim)">Waiting for faction voices...</div></div>
      </div>
    </div>

    <!-- Tab Bar -->
    <div class="tab-bar">
      <div class="tab active" data-tab="thoughts">Thoughts</div>
      <div class="tab" data-tab="quests">Quests</div>
      <div class="tab" data-tab="tech">Tech</div>
      <div class="tab" data-tab="choices">Choices</div>
<div class="tab" data-tab="log">Event Log</div>
<div class="tab" data-tab="network">Network</div>
<div class="tab" data-tab="stances">Stances</div>
<div class="tab" data-tab="votes">Votes</div>
<div class="tab" data-tab="brain">Brain</div>
</div>

    <!-- Tab Content -->
    <div class="tab-content">
      <div class="tab-panel active" id="panel-thoughts"></div>
      <div class="tab-panel" id="panel-quests"></div>
      <div class="tab-panel" id="panel-tech"></div>
      <div class="tab-panel" id="panel-choices"></div>
<div class="tab-panel" id="panel-log"></div>
<div class="tab-panel" id="panel-network"></div>
<div class="tab-panel" id="panel-stances"></div>
<div class="tab-panel" id="panel-votes"></div>
<div class="tab-panel" id="panel-brain"></div>
</div>
  </main>

  <aside>
    <div class="aside-title">Factions</div>
    <div class="faction-list" id="faction-list"></div>
  </aside>
</div>

<script>
// ── Constants ────────────────────────────────────────────────
const FC = {
  military_command:{color:'#F44336',name:'Military Command',leader:'Marshal Ironbound'},
  research_division:{color:'#2196F3',name:'Research Division',leader:'Dr. Prometheus'},

// ── Helpers ──────────────────────────────────────────────────
function esc(s){if(s==null)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v))}
function moodColor(m){return MOOD_COLORS[String(m).toLowerCase()]||'#78909C'}
function factionColor(fid){return(FC[fid]||{}).color||'#78909C'}
function factionName(fid){return(FC[fid]||{}).name||fid.replace(/_/g,' ')}
function stanceClass(s){if(!s)return'neutral';var l=String(s).toLowerCase();if(l==='ally'||l==='allied'||l==='friendly')return'ally';if(l==='enemy'||l==='hostile'||l==='adversarial')return'enemy';return'neutral'}
function stanceColor(s){var c=stanceClass(s);return c==='ally'?'#4CAF50':c==='enemy'?'#F44336':'#FFC107'}
function ago(ts){if(!ts)return'';var s=Math.floor((Date.now()/1000)-ts);if(s<60)return s+'s ago';if(s<3600)return Math.floor(s/60)+'m ago';return Math.floor(s/3600)+'h ago'}

// ── API ──────────────────────────────────────────────────────
async function api(ep,ms){
  var ctl=new AbortController();
  var t=setTimeout(function(){ctl.abort()},ms||10000);
  try{
    var r=await fetch(ep,{headers:{'Accept':'application/json'},signal:ctl.signal});
    clearTimeout(t);
    if(!r.ok)throw new Error(r.status);
    return await r.json();
  }catch(e){clearTimeout(t);return null}
}

function updateHeaderMetrics(ws){
  if(!ws)return;

function updateEra(status){
  if(!status)return;
  // Try multiple locations for era data
  var era=status.current_era||status.era||status.currentEra||{};
  var name=era.name||era.era_name||era.label||status.era_name||status.current_phase||status.game_phase||'Unknown';
  var progress=era.progress!=null?era.progress:(era.progress_pct!=null?era.progress_pct:0);
  // If no direct progress, derive from turns_in_phase
  if(!progress&&status.turns_in_phase!=null){
    progress=Math.min(100,status.turns_in_phase*5); // rough: 20 turns per era
  }
  document.getElementById('era-name').textContent=name.replace(/_/g,' ');
  document.getElementById('era-fill').style.width=clamp(progress,0,100)+'%';
  document.getElementById('era-pct').textContent=Math.round(progress)+'%';
}

var desc=ev.description||ev.message||ev.text||ev.event||'';

'<div class="log-entry '+typeClass+'" style="'+fidBorder+'">'+

var npcFaction={};

var rowData=factions[rowFid];
var stances=rowData&&rowData.stances?rowData.stances:{};
html+='<tr><th style="color:'+factionColor(rowFid)+';text-align:right;padding-right:8px">'+esc(factionName(rowFid))+'</th>';
fids.forEach(function(colFid){
if(rowFid===colFid){
html+='<td class="self"><span class="stances-cell-val">&mdash;</span><span class="stances-cell-label">self</span></td>';
}else{
var s=stances[colFid];
var val=s&&(s.value!=null)?s.value:null;
var label=s?s.label||'':'';
var trend=s?s.trend:0;
var cellClass='neutral-cell';
if(val!==null){
if(val>=0.8)cellClass='ally';
else if(val>=0.6)cellClass='cordial';
else if(val>=0.4)cellClass='neutral-cell';
else if(val>=0.2)cellClass='tense';
else cellClass='hostile';
}
var trendArrow=trend>0.01?' ↑':trend<-0.01?' ↓':'';
html+='<td class="'+cellClass+'">';
html+='<span class="stances-cell-val">'+(val!==null?val.toFixed(2):'?')+'</span>';
html+='<span class="stances-cell-label">'+esc(label)+trendArrow+'</span>';
html+='</td>';
}
});
html+='</tr>';
});
html+='</tbody></table>';
panel.innerHTML=html;
}

// ── Tab: Votes ──────────────────────────────────────────────
function renderVotes(){
var panel=document.getElementById('panel-votes');
if(!choiceResolutions.length){panel.innerHTML='<div style="color:var(--dim)">No detailed vote records yet — votes appear when world events trigger faction choices</div>';return}
var html='<div style="margin-bottom:10px;color:var(--dim);font-size:13px">Faction vote breakdowns on galactic events — most recent first</div>';
choiceResolutions.slice(0,20).forEach(function(r){
var title=r.event_title||r.event_id||'Unknown Event';
var chosen=r.chosen_choice_text||r.chosen_choice_id||'';
var fv=r.faction_votes||{};
var con=r.consequences_applied||[];
var ts=r.resolved_at;
html+='<div class="vote-detail-card">';
html+='<div class="vote-event-title">'+esc(title)+'</div>';
html+='<div class="vote-chosen">Chose: '+esc(chosen.replace(/_/g,' '))+'</div>';
Object.keys(fv).forEach(function(fid){
var vote=fv[fid];
var fc=factionColor(fid);
var choiceLabel=vote.choice_id?vote.choice_id.replace(/_/g,' '):'?';
var score=vote.score!=null?vote.score.toFixed(3):'—';
var ideology=vote.ideology||'';
html+='<div class="vote-faction-row">';
html+='<span class="vf-name" style="color:'+fc+'">'+esc(factionName(fid))+'</span>';
html+='<span class="vf-choice">'+esc(choiceLabel)+'</span>';
html+='<span class="vf-score" style="color:'+fc+'">'+score+'</span>';
html+='</div>';
});
if(con.length){
html+='<div class="vote-consequences"><div style="font-size:10px;text-transform:uppercase;letter-spacing:1px;margin-bottom:4px;color:var(--dim)">Consequences</div>';
con.forEach(function(c){
if(c.applied){
html+='<div class="vote-consequence-item">'+esc(c.effect_type||'')+' → '+esc(c.target||c.world_key||'')+(c.delta?' ('+(c.delta>0?'+':'')+c.delta.toFixed(1)+')':'')+'</div>';
}
});
html+='</div>';
}
if(ts)html+='<div style="margin-top:6px;font-size:10px;color:rgba(255,255,255,0.3)">'+ago(ts)+'</div>';
html+='</div>';
});
panel.innerHTML=html;
}

// ── Tab: Brain ──────────────────────────────────────────────
function renderBrain(){
var panel=document.getElementById('panel-brain');
var fids=Object.keys(factionBrains);
if(!fids.length){panel.innerHTML='<div style="color:var(--dim)">No faction brain state data — brains update every 5 minutes during simulation ticks</div>';return}
var html='<div style="margin-bottom:10px;color:var(--dim);font-size:13px">Faction decision-making priorities — higher weight = higher priority</div>';
fids.forEach(function(fid){
var brain=factionBrains[fid];
var fc=factionColor(fid);
var priorities=brain.priorities||[];
if(!priorities.length)return;
var maxW=0;
priorities.forEach(function(p){if(p.weight>maxW)maxW=p.weight});
if(maxW===0)maxW=1;
html+='<div class="brain-faction-card" style="border-left-color:'+fc+'">';
html+='<div class="brain-faction-name" style="color:'+fc+'">'+esc(factionName(fid))+'</div>';
priorities.forEach(function(p){
var pct=Math.round((p.weight/maxW)*100);
var label=(p.action||'').replace(/_/g,' ');
html+='<div class="brain-priority">';
html+='<span class="bp-label">'+esc(label)+'</span>';
html+='<div class="bp-bar"><div class="bp-fill" style="width:'+pct+'%;background:'+fc+'"></div></div>';
html+='<span class="bp-weight" style="color:'+fc+'">'+p.weight.toFixed(1)+'</span>';
html+='</div>';
});
html+='</div>';
});
panel.innerHTML=html;
}

function renderActiveTab(){
switch(activeTab){
case'thoughts':renderThoughts(npcActivity);break;
case'quests':renderQuests(questLog);break;
case'tech':renderTech(techData);break;
case'choices':renderChoices(choiceStats);break;
case'log':renderLog(eventLog);break;
case'network':renderNetwork();break;
case'stances':renderStances();break;
case'votes':renderVotes();break;
case'brain':renderBrain();break;
}
}

// ── WebSocket ────────────────────────────────────────────────
function connectWS(){
  try{
    var proto=location.protocol==='https:'?'wss:':'ws:';
    ws=new WebSocket(proto+'//'+location.host+'/ws');
    ws.onopen=function(){wsReconnects=0;console.log('WS connected')};
    ws.onmessage=function(e){
      try{
        var d=JSON.parse(e.data);
        if(d.type==='world_state'||d.type==='world_state_update'){
          worldState=d.data||d;
          updateHeaderMetrics(worldState);
        }
        if(d.type==='narration')renderNarration(d.data);
        if(d.type==='event')eventLog.unshift(d.data);
      }catch(err){}
    };
    ws.onclose=function(){
      wsReconnects++;
      var delay=Math.min(5000,1000*wsReconnects);
      setTimeout(connectWS,delay);
    };
    ws.onerror=function(){ws.close()};
  }catch(e){setTimeout(connectWS,5000)}
}

// ── Data Fetching ────────────────────────────────────────────
async function fetchWorldState(){
  var d=await api('/world/state',8000);
  if(d){
    // API returns {state: {tension_level, resource_abundance, ...}, conditions: [...]}
    var ws=d.state||d;
    worldState=ws;
    updateHeaderMetrics(ws);
  }
}

async function fetchStatus(){
  var d=await api('/simulation/status',10000);
  if(d){
    if(d.world_state||d.worldState)updateHeaderMetrics(d.world_state||d.worldState);
    updateEra(d);
  }
  // Also fetch engine-status for era/phase info
  var es=await api('/engine-status',8000);
  if(es){
    updateEra(es.turn_progression||es);
  }
}

async function fetchNarration(){
  var d=await api('/narrator/history',8000);
  // API returns {status, narrations: [...], count}
  var narrs=d&&d.narrations?d.narrations:(Array.isArray(d)?d:[]);
  if(narrs.length){
    narrationHistory=narrs;
    renderNarration(narrs[0]);
  }
}

async function fetchFactions(){
  var d=await api('/simulation/factions',10000);
  if(d)factions=d;
}

async function fetchNPCs(){
  var d=await api('/simulation/npcs/activity',15000);
  // API returns {npcs: [...], count}
  if(d){
    var arr=d.npcs||d;
    npcActivity=Array.isArray(arr)?arr:Object.values(arr);
  }
}

async function fetchQuests(){
  var d=await api('/simulation/npc-quests',10000);
  if(d)questLog=d;
}

async function fetchTech(){
  var d=await api('/simulation/faction-tech',10000);
  if(d)techData=d;
}

async function fetchChoices(){
  var d=await api('/simulation/choice-resolutions',8000);
  if(d)choiceStats=d;
}

async function fetchEvents(){
  var d=await api('/simulation/events',10000);
  if(d){
    var all=[];
    if(d.world_events&&Array.isArray(d.world_events))all=all.concat(d.world_events);
    if(d.cascade_events&&Array.isArray(d.cascade_events))all=all.concat(d.cascade_events);
    if(d.broadcast_events&&Array.isArray(d.broadcast_events))all=all.concat(d.broadcast_events);
    eventLog=all;
  }
}

// ── Main Refresh ─────────────────────────────────────────────
async function refreshLight(){
  await Promise.all([fetchWorldState(),fetchStatus(),fetchNarration(),fetchFactions()]);
  renderFactions(factions,techData,questLog);
}

async function fetchRelationshipNetwork(){
var d=await api('/npcs/relationship-network',15000);
if(d&&d.network)relationshipNetwork=d.network;
}

async function fetchCascadeChains(){
var d=await api('/simulation/cascade-chains',10000);
if(d&&d.chains)cascadeChains=d.chains;
}

async function fetchFactionBrains(){
var d=await api('/simulation/faction-brains',10000);
if(d&&d.factions)factionBrains=d.factions;
}

async function fetchChoiceResolutionsDetail(){
var d=await api('/simulation/choice-resolutions/detail',10000);
if(d&&d.resolutions)choiceResolutions=d.resolutions;
}

async function refreshHeavy(){
await Promise.all([fetchNPCs(),fetchQuests(),fetchTech(),fetchChoices(),fetchEvents(),fetchRelationshipNetwork(),fetchCascadeChains(),fetchFactionBrains(),fetchChoiceResolutionsDetail()]);
  renderActiveTab();
  renderFactions(factions,techData,questLog);
}

async function init(){
  makeStars();
  buildHeaderMetrics();
  connectWS();
  await refreshLight();
  await refreshHeavy();
  setInterval(refreshLight,10000);
  setInterval(refreshHeavy,30000);
}

document.addEventListener('DOMContentLoaded',init);
</script>
