<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Federation Spectator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Libre+Baskerville:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="spectator.css">
</head>
<body>
  <main class="watch-shell" aria-live="polite">
    <section class="hero" aria-labelledby="headline">
      <p class="eyebrow">Federation World TV</p>
      <h1 id="headline">The world is waking up.</h1>
      <p id="plain-summary" class="plain-summary">Listening for the next pulse of the simulation.</p>
      <div class="controls" aria-label="spectator controls">
        <button id="refresh-btn" type="button">Refresh</button>
        <button id="read-btn" type="button">Read Aloud</button>
        <button id="pause-btn" type="button">Pause Auto</button>
      </div>
    </section>

    <section class="story-grid" aria-label="current story">
      <article class="story-panel primary-panel">
        <h2>What You Are Watching</h2>
        <div id="event-list" class="event-list">
          <p class="empty">Waiting for NPC activity.</p>
        </div>
      </article>

      <aside class="story-panel pulse-panel">
        <h2>World Pulse</h2>
        <div id="pulse-list" class="pulse-list"></div>
      </aside>
    </section>

    <section class="assistant-panel" aria-labelledby="assistant-title">
      <h2 id="assistant-title">Ask The World</h2>
      <p class="assistant-hint">Ask in plain language. Example: "who is causing trouble?" or "what just happened?"</p>
      <form id="assistant-form">
        <label class="sr-only" for="question-input">Question for the Federation assistant</label>
        <input id="question-input" name="question" type="text" autocomplete="off" placeholder="Ask what is happening...">
        <button type="submit">Ask</button>
      </form>
      <div id="suggestions" class="suggestions"></div>
      <div id="assistant-answer" class="assistant-answer">The assistant is ready.</div>
    </section>
  </main>

  <script src="error-reporter.js"></script>
  <script src="spectator.js"></script>
</body>
</html>
