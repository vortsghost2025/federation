<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NPC Activity Logs - Federation Dashboard</title>
  <style>
    body { background: #0a0a1a; color: #e0e0ff; font-family: 'Courier New', monospace; padding: 20px; margin: 0; }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    .header h1 { color: #a0a0ff; font-size: 24px; margin: 0; }
    .filters { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
    .filters select, .filters input { background: #151525; border: 1px solid #3a3a6a; color: #e0e0ff; padding: 8px; border-radius: 4px; }
    .filters label { color: #a0a0ff; font-size: 14px; }
    .logs-table { width: 100%; border-collapse: collapse; }
    .logs-table th, .logs-table td { padding: 10px; text-align: left; border-bottom: 1px solid #2a2a4a; }
    .logs-table th { background: #1a1a3a; color: #c0c0ff; cursor: pointer; }
    .logs-table th:hover { background: #252555; }
    .logs-table tr:hover { background: #12122a; }
    .category-badge { padding: 2px 8px; border-radius: 3px; font-size: 12px; }
    .cat-decision { background: #4a6a8a; }
    .cat-interaction { background: #5a7a4a; }
    .cat-cognition { background: #7a4a7a; }
    .cat-chat { background: #8a5a4a; }
    .export-btn { background: #4a6a8a; color: #fff; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .export-btn:hover { background: #5a7a9a; }
    .stats-bar { display: flex; gap: 20px; margin-bottom: 15px; font-size: 14px; color: #a0a0ff; }
    .stats-bar div { background: #151525; padding: 10px 15px; border-radius: 4px; }
    .loading { color: #ffaa00; }
    .error { color: #ff6666; }
  </style>
</head>
<body>
  <div class="header">
    <h1>NPC Activity Logs</h1>
    <button class="export-btn" onclick="exportToCSV()">Export CSV</button>
  </div>

  <div class="stats-bar" id="stats-bar">
    <div class="loading">Loading statistics...</div>
  </div>

  <div class="filters">
    <label>NPC: <select id="npc-filter" onchange="loadLogs()"><option value="all">All NPCs</option></select></label>
    <label>Category: <select id="category-filter" onchange="loadLogs()"><option value="all">All</option><option value="decision">Decision</option><option value="interaction">Interaction</option><option value="cognition">Cognition</option><option value="chat">Chat</option></select></label>
    <label>Search: <input type="text" id="search-filter" placeholder="Search..." oninput="debounceSearch()"></label>
  </div>

  <table class="logs-table" id="logs-table">
    <thead>
      <tr><th onclick="sortTable(0)">NPC</th><th onclick="sortTable(1)">Category</th><th onclick="sortTable(2)">Timestamp</th><th>Details</th></tr>
    </thead>
    <tbody id="logs-body"><tr><td colspan="4" class="loading">Loading logs...</td></tr></tbody>
  </table>

<script>
let allLogs = [];
let currentLogs = [];
let allKnownNpcIds = [];
let sortCol = 2;
let sortDir = -1;

function apiFetch(url) {
  return fetch(url).then(r => r.json()).catch(e => { console.error(e); return null; });
}

function npcId(log) {
  return log.char_id || log.npc_char_id || '';
}

function entryType(log) {
  return log.type || log.category || '';
}

function entryDetails(log) {
  return log.data || log.details || {};
}

function entryTime(log) {
  const ts = Number(log.timestamp || 0);
  return ts < 1000000000000 ? ts * 1000 : ts;
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"]/g, ch => ({
    '&': '&amp;',
    '<': '&lt;',
    '>': '&gt;',
    '"': '&quot;'
  }[ch]));
}

function loadLogs() {
  const npc = document.getElementById('npc-filter').value;
  const cat = document.getElementById('category-filter').value;
  const term = document.getElementById('search-filter').value.toLowerCase();
  
  if (!allLogs.length) {
    currentLogs = [];
    renderLogs([]);
    return;
  }
  
  let filtered = allLogs.filter(l => {
    if (npc !== 'all' && npcId(l) !== npc) return false;
    if (cat !== 'all' && entryType(l) !== cat) return false;
    if (term && !JSON.stringify(l).toLowerCase().includes(term)) return false;
    return true;
  });
  
  filtered.sort((a, b) => {
    const values = [npcId, entryType, entryTime];
    const valA = values[sortCol](a);
    const valB = values[sortCol](b);
    return sortDir * (typeof valA === 'string' ? valA.localeCompare(valB) : valA - valB);
  });
  
  currentLogs = filtered;
  renderLogs(filtered);
}

function renderLogs(logs) {
  const tbody = document.getElementById('logs-body');
  tbody.innerHTML = logs.length ? logs.map(l => {
    const type = entryType(l);
    const catClass = 'cat-' + type.replace(/[^a-z0-9_-]/gi, '');
    const ts = new Date(entryTime(l)).toLocaleString();
    const details = escapeHtml(JSON.stringify(entryDetails(l), null, 2));
    return `<tr><td>${escapeHtml(npcId(l))}</td><td><span class="category-badge ${catClass}">${escapeHtml(type)}</span></td><td>${ts}</td><td><pre style="margin:0;white-space:pre-wrap;word-break:break-all;font-size:12px;max-width:600px;overflow-x:auto">${details}</pre></td></tr>`;
  }).join('') : '<tr><td colspan="4" style="color:#ff6666">No logs found</td></tr>';
}

function sortTable(col) {
  sortDir = sortCol === col ? -sortDir : 1;
  sortCol = col;
  loadLogs();
}

function debounceSearch() {
  clearTimeout(window.searchTimer);
  window.searchTimer = setTimeout(loadLogs, 300);
}

function exportToCSV() {
  const rows = currentLogs.length ? currentLogs : allLogs;
  if (!rows.length) return;
  const csv = ['npc_char_id,category,timestamp,details'];
  rows.forEach(l => {
    csv.push(`"${npcId(l)}","${entryType(l)}","${new Date(entryTime(l)).toISOString()}","${JSON.stringify(entryDetails(l)).replace(/"/g, '""')}"`);
  });
  const blob = new Blob([csv.join('\n')], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'npc-logs-' + new Date().toISOString().slice(0,10) + '.csv';
  a.click();
}

async function loadStats() {
  const s = await apiFetch('/npcs/stats');
  const sb = document.getElementById('stats-bar');
  if (s && s.total_entries !== undefined) {
    sb.innerHTML = `<div>Total: ${s.total_entries}</div><div>Decisions: ${s.categories?.decision || 0}</div><div>Interactions: ${s.categories?.interaction || 0}</div><div>Cognitions: ${s.categories?.cognition || 0}</div><div>Chats: ${s.categories?.chat || 0}</div>`;
  } else {
    sb.innerHTML = '<div class="error">Failed to load stats</div>';
  }
}

async function loadAllLogs() {
  if (!allKnownNpcIds.length) await loadNpcOptions();
  const npcs = allKnownNpcIds.length ? allKnownNpcIds : [];
  if (!npcs.length) { renderLogs([]); return; }
  const promises = npcs.map(id => apiFetch('/npc-logs?char_id=' + id + '&limit=200').then(d => d?.results || []));
  const results = await Promise.all(promises);
  allLogs = results.flat().sort((a, b) => entryTime(b) - entryTime(a));
  loadLogs();
}

async function loadNpcOptions() {
  const data = await apiFetch('/npcs?limit=200');
  const npcs = data?.npcs || [];
  allKnownNpcIds = npcs.map(n => n.char_id).filter(Boolean);

  const select = document.getElementById('npc-filter');
  const selected = select.value;
  select.innerHTML = '<option value="all">All NPCs</option>' + npcs.map(n => {
    const label = n.name ? `${n.char_id} - ${n.name}` : n.char_id;
    return `<option value="${escapeHtml(n.char_id)}">${escapeHtml(label)}</option>`;
  }).join('');
  if ([...select.options].some(option => option.value === selected)) select.value = selected;
}

loadStats();
loadAllLogs();
setInterval(loadStats, 30000);
setInterval(loadAllLogs, 60000);
</script>
</body>
</html>
