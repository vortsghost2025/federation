# Local SHADOW container qualification only. NOT deployed to VPS.
# This file defines a fully isolated shadow environment:
#   * dedicated internal network (shadow-net, internal: true) — never on fed-net
#   * dedicated fake Redis (redis-shadow) — no production Redis
#   * deterministic mock provider (no credentials, no internet)
#   * non-root user, read-only root fs, cap_drop: ALL, no-new-privileges
#   * restart: "no", bounded memory/cpu/pids, tick/model-call/log limits
#   * no Docker socket, no host or project mounts, only a shadow-log volume
#
# Qualification gate (run locally, NOT on VPS):
#   docker compose -f docker-compose-shadow.yml up --build
#   -> assert: zero production endpoints, zero credentials, intent log only,
#      no messages/artifacts/institutions/capabilities written.
#   docker compose -f docker-compose-shadow.yml down -v   # teardown

networks:
  shadow-net:
    driver: bridge
    internal: true

volumes:
  shadow-log:
  redis-shadow-data:

services:
  redis-shadow:
    image: redis:7-alpine
    restart: "no"
    networks:
      - shadow-net
    volumes:
      - redis-shadow-data:/data
    # Fake Redis is the ONLY datastore; no persistence to production.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64

  npc-agent-shadow-001:
    build:
      context: ./npc-agent
      dockerfile: ../npc-agent-shadow/Dockerfile
    restart: "no"
    networks:
      - shadow-net
    depends_on:
      - redis-shadow
    environment:
      SHADOW_MODE: "true"
      SHADOW_INSTANCE_ID: "shadow-001"
      SHADOW_PROVIDER: "mock"
      SHADOW_LOG_PATH: "/shadow-log/intents-001.jsonl"
      SHADOW_MAX_TICKS: "200"
      SHADOW_MAX_RUNTIME_S: "3600"
      SHADOW_MAX_MODEL_CALLS: "50"
      SHADOW_MAX_LOG_BYTES: "10485760"
      CHAR_ID: "char_001"
      NPC_NAME: "Archimedes Prime"
      REDIS_URL: "redis://redis-shadow:6379/0"
      # Explicitly empty — qualification must run with NO production credentials.
      NVIDIA_API_KEY: ""
      FALLBACK_KEY_1: ""
      FALLBACK_KEY_2: ""
      OPENROUTER_API_KEY: ""
      OPERATOR_LLM_API_KEY: ""
      DATABASE_URL: ""
      POSTGRES_URL: ""
      POSTGRES_PASSWORD: ""
      REDIS_PASSWORD: ""
    volumes:
      - shadow-log:/shadow-log
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
    # No Docker socket, no host mounts, no project mounts.

  npc-agent-shadow-306:
    build:
      context: ./npc-agent
      dockerfile: ../npc-agent-shadow/Dockerfile
    restart: "no"
    networks:
      - shadow-net
    depends_on:
      - redis-shadow
    environment:
      SHADOW_MODE: "true"
      SHADOW_INSTANCE_ID: "shadow-306"
      SHADOW_PROVIDER: "mock"
      SHADOW_LOG_PATH: "/shadow-log/intents-306.jsonl"
      SHADOW_MAX_TICKS: "200"
      SHADOW_MAX_RUNTIME_S: "3600"
      SHADOW_MAX_MODEL_CALLS: "50"
      SHADOW_MAX_LOG_BYTES: "10485760"
      CHAR_ID: "char_306"
      NPC_NAME: "The Oracle"
      REDIS_URL: "redis://redis-shadow:6379/0"
      NVIDIA_API_KEY: ""
      FALLBACK_KEY_1: ""
      FALLBACK_KEY_2: ""
      OPENROUTER_API_KEY: ""
      OPERATOR_LLM_API_KEY: ""
      DATABASE_URL: ""
      POSTGRES_URL: ""
      POSTGRES_PASSWORD: ""
      REDIS_PASSWORD: ""
    volumes:
      - shadow-log:/shadow-log
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 1.0
    pids_limit: 128
